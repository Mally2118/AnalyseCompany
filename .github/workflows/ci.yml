name: Проверка pull request
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-recovery.txt
      - run: python -m pip install -r scripts/requirements-recovery.txt
      - run: npm ci
      - run: npm run recovery:check
      - run: npm run data:validate
      - run: npm test
      - run: npm run build
      # The hosted runner has Chrome's system libraries; avoid an extra apt download.
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
